<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TXDownloader Legal Pages</title>
  <meta name="description" content="TXDownloader privacy policy language index.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5e6b82;
      --line: #dfe5ef;
      --accent: #0b6bcb;
      --accent-soft: #e8f2ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10141d;
        --panel: #171d29;
        --text: #eef3fb;
        --muted: #a7b2c5;
        --line: #2a3344;
        --accent: #74b7ff;
        --accent-soft: #152941;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans CJK SC", "Noto Sans Thai", "Noto Sans KR", "Noto Sans JP", Arial, sans-serif;
      line-height: 1.65;
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }
    header, section, footer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.12;
      letter-spacing: 0;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 1.18rem;
      letter-spacing: 0;
    }
    p { margin: 0; }
    .meta, .summary, footer { color: var(--muted); }
    .summary {
      background: var(--accent-soft);
      border-color: var(--line);
    }
    .language-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }
    a {
      color: var(--accent);
      text-underline-offset: 3px;
    }
    .language-nav a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      text-decoration: none;
      font-weight: 650;
    }
    .language-nav a[aria-current="page"] {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>TXDownloader Legal Pages</h1>
      <p class="meta">Updated: 2026-05-31 | Version: V1.0</p>
    </header>
    <section class="summary">
      <h2>Privacy Policy</h2>
      <p>Select a language to view the TXDownloader privacy policy.</p>
      <nav class="language-nav" aria-label="Privacy policy languages"><a href="https://sharkmabin.github.io/txdownload-legal/privacy/zh-CN/">简体中文</a><a href="https://sharkmabin.github.io/txdownload-legal/privacy/en-US/">English</a><a href="https://sharkmabin.github.io/txdownload-legal/privacy/ja-JP/">日本語</a><a href="https://sharkmabin.github.io/txdownload-legal/privacy/ko-KR/">한국어</a><a href="https://sharkmabin.github.io/txdownload-legal/privacy/th-TH/">ไทย</a><a href="https://sharkmabin.github.io/txdownload-legal/privacy/vi-VN/">Tiếng Việt</a></nav>
    </section>
  </main>
</body>
</html>
